[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
license = "BSD-3-Clause"
name = "hyperopt"
dynamic = ["version"]
description = "Distributed Asynchronous Hyperparameter Optimization"
readme = "README.md"
authors = [{ name = "James Bergstra", email = "james.bergstra@gmail.com" }]
keywords = ["Bayesian optimization", "hyperparameter", "model selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.17",
    "scipy>=1.5.0",
    "networkx>=2.2",
    "tqdm",
    "cloudpickle",
    "importlib-resources>=1.3; python_version < '3.9'",
]

[project.optional-dependencies]
SparkTrials = ["pyspark", "py4j"]
MongoTrials = ["pymongo>=4.0.0"]
ATPE = ["lightgbm", "scikit-learn"]

[dependency-groups]
testing = [
    "pytest",
    "hyperopt[SparkTrials,MongoTrials,ATPE]"  # install witl all deps when testing
]
lint = [
    "mypy",
]
dev = [
    {include-group = "testing"},
    {include-group = "lint"},
    "pre-commit",
    "nox",
    "pyyaml",
]

[project.urls]
Homepage = "https://hyperopt.github.io/hyperopt"
Source = "https://github.com/hyperopt/hyperopt"

[project.scripts]
hyperopt-mongo-worker = "hyperopt.mongoexp:main"

[tool.hatch.version]
source = "vcs"
raw-options = {version_scheme = "no-guess-dev"}

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "I",   # isort
    "UP",  # pyupgrade
    "F401", # unused-imports autoremove
]
ignore = [
    "UP031",  # printf-style formatting — large existing codebase, not enforced
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: imports are intentionally exposed to consumers
"hyperopt/__init__.py" = ["F401"]
"hyperopt/hp.py" = ["F401"]
"hyperopt/pyll/__init__.py" = ["F401"]

[tool.pytest.ini_options]
norecursedirs = [
    "dist",
    "build",
    ".venv",
    ".nox",
]
markers = [
    "slow: mark test as slow (scipy internal mark, imported via test_rdists)",
    "xslow: mark test as extremely slow (scipy internal mark, imported via test_rdists)",
    "thread_unsafe: mark test as not thread-safe (scipy internal mark, imported via test_rdists)",
]